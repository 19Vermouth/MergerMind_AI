services:
  postgres:
    image: postgres:16-alpine
    container_name: dealsense_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealsense}
      POSTGRES_USER: ${POSTGRES_USER:-dealsense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealsense_user} -d ${POSTGRES_DB:-dealsense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dealsense-network

  minio:
    image: minio/minio:latest
    container_name: dealsense_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dealsense-network

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set dealsense http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb dealsense/${MINIO_BUCKET_RAW:-dealsense-raw} --ignore-existing &&
      mc mb dealsense/${MINIO_BUCKET_PROCESSED:-dealsense-processed} --ignore-existing &&
      mc mb dealsense/${MINIO_BUCKET_MODELS:-dealsense-models} --ignore-existing &&
      mc anonymous set public dealsense/${MINIO_BUCKET_RAW:-dealsense-raw} &&
      exit 0"
    networks:
      - dealsense-network

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: dealsense_airflow_webserver
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-dealsense_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-dealsense}
      AIRFLOW__CORE__FERNET_KEY: ${_AIRFLOW_SECRET_KEY:-dummy_key_for_dev_change_in_prod}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${_AIRFLOW_SECRET_KEY:-change_me}
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scraping:/opt/airflow/scraping
      - ./src:/opt/airflow/src
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dealsense-network

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: dealsense_airflow_scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-dealsense_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-dealsense}
      AIRFLOW__CORE__FERNET_KEY: ${_AIRFLOW_SECRET_KEY:-dummy_key_for_dev_change_in_prod}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scraping:/opt/airflow/scraping
      - ./src:/opt/airflow/src
    command: scheduler
    networks:
      - dealsense-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: dealsense_mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - dealsense-network

  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: dealsense_fastapi
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-dealsense}
      POSTGRES_USER: ${POSTGRES_USER:-dealsense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dealsense-network

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: dealsense_streamlit
    env_file:
      - .env
    ports:
      - "8501:8501"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-dealsense}
      POSTGRES_USER: ${POSTGRES_USER:-dealsense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    depends_on:
      fastapi:
        condition: service_started
    networks:
      - dealsense-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dealsense_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dealsense.ai
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - dealsense-network

volumes:
  pgdata:
  minio-data:
  mlflow-artifacts:

networks:
  dealsense-network:
    driver: bridge